name: CI - Testes e Qualidade de Código

on:
  push:
    branches: ["main", "qualidade-e-testes"]
  pull_request:
    branches: ["main", "qualidade-e-testes"]

jobs:
  backend:
    name: Back-End (ESLint + Jest & Cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Análise estática (ESLint)
        run: npm run lint

      - name: Testes unitários e de integração com cobertura
        run: npm run test:coverage
        env:
          NODE_ENV: test

  frontend:
    name: Front-End (ESLint + Vitest & Cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Análise estática (ESLint)
        run: npm run lint

      - name: Testes unitários e de interface com cobertura
        run: npm run test:coverage